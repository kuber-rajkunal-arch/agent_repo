  /* Floating legend box */

<script>
  // Collapse / Expand legend
  (function() {
    const btn = document.getElementById('toggle_btn');
    const content = document.getElementById('legend_content');
    let collapsed = false;
    btn.addEventListener('click', function() {
      collapsed = !collapsed;
      content.style.display = collapsed ? 'none' : 'block';
      btn.textContent = collapsed ? 'Show' : 'Hide';
    });
  })();

  // Optional: make the legend draggable
  (function makeDraggable() {
    const box = document.getElementById('legend_box');
    let isDown = false;
    let offset = [0, 0];

    box.addEventListener('mousedown', function(e) {
      if (e.target.id === 'toggle_btn') return; // ignore button clicks
      isDown = true;
      box.classList.add('dragging');
      offset = [
        box.offsetLeft - e.clientX,
        box.offsetTop - e.clientY
      ];
    });

    document.addEventListener('mouseup', function() {
      isDown = false;
      box.classList.remove('dragging');
    });

    document.addEventListener('mousemove', function(event) {
      if (!isDown) return;
      event.preventDefault();
      let newLeft = event.clientX + offset[0];
      let newTop  = event.clientY + offset[1];

      // Keep inside viewport
      const pad = 8;
      const maxLeft = window.innerWidth - box.offsetWidth - pad;
      const maxTop  = window.innerHeight - box.offsetHeight - pad;
      if (newLeft < pad) newLeft = pad;
      if (newTop < pad) newTop = pad;
      if (newLeft > maxLeft) newLeft = maxLeft;
      if (newTop > maxTop) newTop = maxTop;

      box.style.left = newLeft + 'px';
      box.style.top = newTop + 'px';
    });
  })();
</script>
