[project]
name = "realtime-iot-data-processor"
version = "0.1.0"
description = "A Python system for real-time IoT data processing for logistics."
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [] # No external dependencies beyond standard library for this project.
requires-python = ">=3.8"
readme = "README.md"
license = { file = "LICENSE" }

[project.urls]
"Homepage" = "https://github.com/yourusername/realtime-iot-data-processor"
"Bug Tracker" = "https://github.com/yourusername/realtime-iot-data-processor/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"] # Search for packages in the 'src' directory
